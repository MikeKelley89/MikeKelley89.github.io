<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>jQuery sample</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;color:#18232d}button{padding:9px 14px;background:#087e78;color:white;border:0;border-radius:4px;cursor:pointer}input{padding:9px;border:1px solid #aab8b7;border-radius:4px}#message{padding:12px;background:#edf3f1;border-radius:5px}</style><script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script></head><body><p>JAVASCRIPT / JQUERY SAMPLE</p><h1>Validate and update the page</h1><p>Enter a short project label. The example validates input and updates the DOM without reloading.</p><form id="sample-form"><label for="label">Project label</label> <input id="label" maxlength="50" required> <button type="submit">Add label</button></form><p id="message" role="status" aria-live="polite">No label added yet.</p><p><a href="/">← Back to portfolio</a></p><script>$(function(){ $('#sample-form').on('submit',function(event){event.preventDefault();const value=$.trim($('#label').val());if(!value){$('#message').text('Enter a label before submitting.');return;}$('#message').text('Current project label: '+value);});});</script></body></html>
